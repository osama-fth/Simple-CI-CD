services:
  db:
    image: postgres:17.7-alpine
    container_name: libraryManagementSystem-db
    env_file:
      - ./.env
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: ./app
    image: library-management-system:latest
    container_name: libraryManagementSystem-app
    env_file:
      - ./.env
    ports:
      - "${APP_PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    command: npm start

volumes:
  db-data:
